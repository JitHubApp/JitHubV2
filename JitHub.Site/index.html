<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="canonical" href="https://jithub.app/" />
  <meta name="theme-color" content="#eef1e7" data-theme-color />
  <meta name="description" content="JitHub is a native GitHub client for Windows with repositories, issues, pull requests, code, rich files, commits, Stars, Gists, profiles, and live color themes." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jithub.app/" />
  <meta property="og:title" content="JitHub | GitHub, native to Windows" />
  <meta property="og:description" content="A native Windows workspace for repositories, issues, pull requests, code, commits, Stars, Gists, and profiles." />
  <meta property="og:image" content="https://jithub.app/media/showcase/home-workspace-light.png" />
  <meta property="og:image:width" content="3200" />
  <meta property="og:image:height" content="1800" />
  <meta property="og:image:alt" content="JitHub's customizable Home workspace on Windows." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="JitHub | GitHub, native to Windows" />
  <meta name="twitter:description" content="A native Windows workspace for everyday GitHub work." />
  <meta name="twitter:image" content="https://jithub.app/media/showcase/home-workspace-light.png" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>JitHub | GitHub, native to Windows</title>
  <script>
    (() => {
      const root = document.documentElement;
      let theme;
      try { theme = localStorage.getItem('jithub-web-theme'); } catch { /* storage can be disabled */ }
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.dataset.theme = theme;
      root.style.colorScheme = theme;
    })();
  </script>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preload" href="/fonts/instrument-serif-regular.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/ibm-plex-mono-regular-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/app.css" />
  <script src="/js/theme.js" defer></script>
  <script src="/js/media.js" defer></script>
</head>

  <!--JITHUB_APP-->
</body>
</html>
