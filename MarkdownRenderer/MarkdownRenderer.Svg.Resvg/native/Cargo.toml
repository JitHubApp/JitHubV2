[package]
name = "markdown-renderer-resvg-worker"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace]
members = ["vendor/resvg", "vendor/usvg", "vendor/tiny-skia", "vendor/tiny-skia-path"]
exclude = ["vendor/image-webp"]
resolver = "3"

[[bin]]
name = "markdown_renderer_resvg_worker"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
data-url = "=0.3.2"
imagesize = "=0.15.0"
image-webp = { version = "=0.2.4", default-features = false }
moxcms = { version = "=0.8.1", default-features = false, features = ["lut"] }
resvg = { git = "https://github.com/linebender/resvg.git", rev = "68b14c4c3bccdb60344c777406486b54c36ec1a4", version = "=0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
sha2 = "=0.10.9"

# Preserve the approved revision while carrying narrowly scoped rendering and
# text fixes in reproducible, inventory-verified upstream source trees.
[patch."https://github.com/linebender/resvg.git"]
resvg = { path = "vendor/resvg" }
usvg = { path = "vendor/usvg" }

[patch.crates-io]
tiny-skia = { path = "vendor/tiny-skia" }
tiny-skia-path = { path = "vendor/tiny-skia-path" }
image-webp = { path = "vendor/image-webp" }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# Keep the analytic rasterizer at the higher optimization level while using
# the smaller release optimization profile for other native dependencies.
[profile.release.package."tiny-skia"]
opt-level = 3

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
