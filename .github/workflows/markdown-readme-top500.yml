name: Top 500 README browser parity

on:
  pull_request:
    paths:
      - ".github/workflows/markdown-readme-top500.yml"
      - "eng/Invoke-TopReadmeAudit.ps1"
      - "eng/readme-audit/**"
      - "JitHub.WinUI/**"
      - "JitHub.WinUI.Automation/**"
      - "MarkdownRenderer/**"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      diagnostic_rank:
        description: Optional focused image diagnostic rank (0 runs all 500)
        required: false
        default: 0
        type: number
      diagnostic_corpus_run_id:
        description: Existing full-audit run ID supplying the pinned corpus
        required: false
        type: string
      diagnostic_repeats:
        description: Independent diagnostic replays (1-5)
        required: false
        default: 3
        type: number
      diagnostic_raster_stages:
        description: Enable intrusive raster tracing (leave off for SVG)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: markdown-readme-top500-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_rank > 0 && format('diagnostic-{0}', inputs.diagnostic_rank) || 'full' }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  DOTNET_NOLOGO: "true"
  MSBUILDDISABLENODEREUSE: "1"
  NUGET_XMLDOC_MODE: skip
  GH_TOKEN: ${{ github.token }}

jobs:
  corpus:
    name: Pin the current top-500 corpus
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostic_rank == 0
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate immutable repository and README manifest
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'readme-corpus\top-repositories.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $output) | Out-Null
          try {
            .\eng\readme-audit\New-TopReadmeManifest.ps1 -Count 500 -OutputPath $output
          }
          catch {
            # The ephemeral GITHUB_TOKEN can occasionally be unavailable to
            # gh even though Actions injected it (for example while GitHub is
            # rotating an installation token). Treat that the same as a
            # metadata rate limit: use only the recent, rigorously validated
            # immutable snapshot. Parsing, validation, and integrity failures
            # remain fatal and cannot silently fall back.
            if ($_.Exception.ToString() -notmatch '(?i)(rate limit exceeded|GitHub CLI must be authenticated)') {
              throw
            }

            Write-Warning "Live GitHub corpus metadata is temporarily unavailable: $($_.Exception.Message)"
            Write-Warning 'Using the recent checked-in immutable snapshot after strict validation.'
            .\eng\readme-audit\Copy-ValidatedTopReadmeManifest.ps1 `
              -SourcePath '.\eng\readme-audit\pinned-top500.json' `
              -OutputPath $output `
              -ExpectedCount 500 `
              -MaximumAgeDays 14

            # PowerShell preserves the most recent native process exit code
            # even after its exception is handled and later cmdlets succeed.
            # Do this only after snapshot validation has completed.
            $global:LASTEXITCODE = 0
          }

      - name: Upload pinned corpus
        uses: actions/upload-artifact@v7
        with:
          name: readme-top500-corpus
          path: ${{ runner.temp }}/readme-corpus/top-repositories.json
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Audit ranks ${{ matrix.start }}-${{ matrix.end }}
    needs: corpus
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostic_rank == 0
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { start: 1, end: 25 }
          - { start: 26, end: 50 }
          - { start: 51, end: 75 }
          - { start: 76, end: 100 }
          - { start: 101, end: 125 }
          - { start: 126, end: 150 }
          - { start: 151, end: 175 }
          - { start: 176, end: 200 }
          - { start: 201, end: 225 }
          - { start: 226, end: 250 }
          - { start: 251, end: 275 }
          - { start: 276, end: 300 }
          - { start: 301, end: 325 }
          - { start: 326, end: 350 }
          - { start: 351, end: 375 }
          - { start: 376, end: 400 }
          - { start: 401, end: 425 }
          - { start: 426, end: 450 }
          - { start: 451, end: 475 }
          - { start: 476, end: 500 }
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Set up Node.js 22 for the Edge oracle
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Edge navigation and profile-lifetime contracts
        run: node --test .\eng\readme-audit\browser-launch.test.mjs .\eng\readme-audit\browser-navigation.test.mjs .\eng\readme-audit\browser-process-lifetime.test.mjs

      - name: Install pinned Windows App Runtime 1.8.10
        run: .\eng\readme-audit\Install-PinnedWindowsAppRuntime.ps1

      - name: Download pinned corpus
        uses: actions/download-artifact@v8
        with:
          name: readme-top500-corpus
          path: ${{ runner.temp }}/readme-corpus

      - name: Compare every README with GitHub in Edge
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'readme-audit'
          $shardCount = ${{ matrix.end }} - ${{ matrix.start }} + 1
          .\eng\Invoke-TopReadmeAudit.ps1 `
            -StartRank ${{ matrix.start }} `
            -Count $shardCount `
            -Configuration Release `
            -ManifestPath (Join-Path $env:RUNNER_TEMP 'readme-corpus\top-repositories.json') `
            -OutputRoot $output

      - name: Capture WinUI crash metadata for failed audits
        if: failure()
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'readme-audit'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $result = [ordered]@{ Status = 'available'; Events = @() }
          try {
            $events = @(Get-WinEvent -FilterHashtable @{
              LogName = 'Application'
              ProviderName = 'Application Error'
              Id = 1000
              StartTime = (Get-Date).AddHours(-4)
            } -MaxEvents 512 -ErrorAction Stop)
            $matches = foreach ($event in $events) {
              [xml]$xml = $event.ToXml()
              $fields = @{}
              foreach ($entry in @($xml.Event.EventData.Data)) {
                if ($entry.Name) { $fields[[string]$entry.Name] = [string]$entry.'#text' }
              }
              if ($fields.AppName -ne 'JitHub.WinUI.exe') { continue }
              [ordered]@{
                TimeUtc = $event.TimeCreated.ToUniversalTime().ToString('O')
                FaultingModule = $fields.ModuleName
                ExceptionCode = $fields.ExceptionCode
                FaultingOffset = $fields.FaultingOffset
                ProcessId = $fields.ProcessId
              }
            }
            $result.Events = if ($null -eq $matches) { @() } else { @($matches) }
          }
          catch {
            # Event-log access is diagnostic only; it never waives the failed audit.
            if ($_.FullyQualifiedErrorId -match '^NoMatchingEventsFound') {
              $result.Status = 'no-events'
            }
            else {
              $result.Status = 'unavailable'
              $result.Reason = $_.Exception.GetType().Name
            }
          }
          $result | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $output 'crash-events.json')

      - name: Upload full-page evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-audit-${{ matrix.start }}-${{ matrix.end }}
          path: |
            ${{ runner.temp }}/readme-audit/summary.json
            ${{ runner.temp }}/readme-audit/summary.md
            ${{ runner.temp }}/readme-audit/crash-events.json
            ${{ runner.temp }}/readme-audit/cases/**/result.json
            ${{ runner.temp }}/readme-audit/cases/**/browser/**
            ${{ runner.temp }}/readme-audit/cases/**/native/**
            !${{ runner.temp }}/readme-audit/cases/**/.runtime/**
          if-no-files-found: warn
          retention-days: 14

  consolidate:
    name: Consolidate all 500 results
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.diagnostic_rank == 0)
    needs: audit
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download every audit shard
        uses: actions/download-artifact@v8
        with:
          pattern: readme-audit-*
          path: ${{ runner.temp }}/readme-audit-shards
          merge-multiple: true

      - name: Require one complete top-500 verdict
        run: |
          .\eng\readme-audit\Merge-TopReadmeAudit.ps1 `
            -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'readme-audit-shards') `
            -ExpectedCount 500 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'readme-audit-consolidated')

      - name: Upload consolidated verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-audit-consolidated
          path: ${{ runner.temp }}/readme-audit-consolidated/**
          if-no-files-found: warn
          retention-days: 30

  diagnose:
    name: Replay rank ${{ inputs.diagnostic_rank }} with image diagnostics
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_rank > 0
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout requested renderer revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Set up Node.js 22 for the Edge oracle
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pinned Windows App Runtime 1.8.10
        run: .\eng\readme-audit\Install-PinnedWindowsAppRuntime.ps1

      - name: Download and validate the exact pinned corpus
        env:
          AUDIT_CORPUS_RUN_ID: ${{ inputs.diagnostic_corpus_run_id }}
          AUDIT_RANK: ${{ inputs.diagnostic_rank }}
          AUDIT_REPEATS: ${{ inputs.diagnostic_repeats }}
        run: |
          $corpusRunId = 0L
          $rank = 0
          $repeats = 0
          if (-not [long]::TryParse($env:AUDIT_CORPUS_RUN_ID, [ref]$corpusRunId) -or $corpusRunId -le 0) {
            throw 'diagnostic_corpus_run_id must be a positive Actions run ID.'
          }
          if (-not [int]::TryParse($env:AUDIT_RANK, [ref]$rank) -or $rank -lt 1 -or $rank -gt 500) {
            throw 'diagnostic_rank must be between 1 and 500.'
          }
          if (-not [int]::TryParse($env:AUDIT_REPEATS, [ref]$repeats) -or $repeats -lt 1 -or $repeats -gt 5) {
            throw 'diagnostic_repeats must be between 1 and 5.'
          }

          $corpusDirectory = Join-Path $env:RUNNER_TEMP 'readme-image-corpus'
          New-Item -ItemType Directory -Force -Path $corpusDirectory | Out-Null
          gh run download $corpusRunId --repo $env:GITHUB_REPOSITORY --name readme-top500-corpus --dir $corpusDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the requested pinned corpus.' }
          $raw = Join-Path $corpusDirectory 'top-repositories.json'
          $validated = Join-Path $corpusDirectory 'validated-top-repositories.json'
          .\eng\readme-audit\Copy-ValidatedTopReadmeManifest.ps1 `
            -SourcePath $raw -OutputPath $validated -ExpectedCount 500 -MaximumAgeDays 14
          "AUDIT_VALIDATED_CORPUS=$validated" >> $env:GITHUB_ENV
          "AUDIT_VALIDATED_RANK=$rank" >> $env:GITHUB_ENV
          "AUDIT_VALIDATED_REPEATS=$repeats" >> $env:GITHUB_ENV

      - name: Replay on the hosted runner with image diagnostics
        env:
          AUDIT_RASTER_DIAGNOSTICS: ${{ inputs.diagnostic_raster_stages }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'readme-image-diagnostic'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $failures = [Collections.Generic.List[string]]::new()
          for ($attempt = 1; $attempt -le [int]$env:AUDIT_VALIDATED_REPEATS; $attempt++) {
            $attemptOutput = Join-Path $output "attempt-$attempt"
            try {
              $arguments = @{
                StartRank = [int]$env:AUDIT_VALIDATED_RANK
                Count = 1
                Configuration = 'Release'
                ManifestPath = $env:AUDIT_VALIDATED_CORPUS
                OutputRoot = $attemptOutput
              }
              if ($env:AUDIT_RASTER_DIAGNOSTICS -eq 'true') {
                $arguments.RasterDiagnostics = $true
              }
              if ($attempt -gt 1) { $arguments.SkipBuild = $true }
              .\eng\Invoke-TopReadmeAudit.ps1 @arguments
            }
            catch {
              $failures.Add("Attempt ${attempt}: $($_.Exception.Message)")
              Write-Warning $failures[$failures.Count - 1]
            }
          }
          if ($failures.Count -gt 0) {
            throw "$($failures.Count) of $($env:AUDIT_VALIDATED_REPEATS) diagnostic replays failed. See the uploaded evidence."
          }

      - name: Upload all diagnostic evidence, including failed attempts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-image-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/readme-image-diagnostic
          if-no-files-found: warn
          retention-days: 14
