name: Top 500 README browser parity

on:
  pull_request:
    paths:
      - ".github/workflows/markdown-readme-top500.yml"
      - "eng/Invoke-TopReadmeAudit.ps1"
      - "eng/readme-audit/**"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "NuGet.config"
      - "JitHub.WinUI/**"
      - "JitHub.WinUI.Automation/**"
      - "MarkdownRenderer/**"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      diagnostic_rank:
        description: Optional focused image diagnostic rank (0 runs all 500)
        required: false
        default: 0
        type: number
      diagnostic_corpus_run_id:
        description: Existing full-audit run ID supplying the pinned corpus
        required: false
        type: string
      diagnostic_repeats:
        description: Independent diagnostic replays (1-5)
        required: false
        default: 3
        type: number
      diagnostic_prior_cases:
        description: Also replay up to four preceding ranks per attempt for shard context
        required: false
        default: 0
        type: number
      diagnostic_raster_stages:
        description: Enable intrusive raster tracing (leave off for SVG)
        required: false
        default: false
        type: boolean
      same_byte_release:
        description: Run and qualify a fresh same-byte capture across all 500 pinned README cases
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: markdown-readme-top500-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_rank > 0 && format('diagnostic-{0}', inputs.diagnostic_rank) || (github.event_name == 'workflow_dispatch' && inputs.same_byte_release && 'same-byte-release' || 'full') }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  DOTNET_NOLOGO: "true"
  MSBUILDDISABLENODEREUSE: "1"
  NUGET_XMLDOC_MODE: skip
  GH_TOKEN: ${{ github.token }}

jobs:
  corpus:
    name: Pin the current top-500 corpus
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostic_rank == 0
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate immutable repository and README manifest
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'readme-corpus\top-repositories.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $output) | Out-Null
          try {
            .\eng\readme-audit\New-TopReadmeManifest.ps1 -Count 500 -OutputPath $output
          }
          catch {
            # The ephemeral GITHUB_TOKEN can occasionally be unavailable to
            # gh even though Actions injected it (for example while GitHub is
            # rotating an installation token). Treat that the same as a
            # metadata rate limit: use only the recent, rigorously validated
            # immutable snapshot. Parsing, validation, and integrity failures
            # remain fatal and cannot silently fall back.
            if ($_.Exception.ToString() -notmatch '(?i)(rate limit exceeded|GitHub CLI must be authenticated)') {
              throw
            }

            Write-Warning "Live GitHub corpus metadata is temporarily unavailable: $($_.Exception.Message)"
            Write-Warning 'Using the recent checked-in immutable snapshot after strict validation.'
            .\eng\readme-audit\Copy-ValidatedTopReadmeManifest.ps1 `
              -SourcePath '.\eng\readme-audit\pinned-top500.json' `
              -OutputPath $output `
              -ExpectedCount 500 `
              -MaximumAgeDays 14

            # PowerShell preserves the most recent native process exit code
            # even after its exception is handled and later cmdlets succeed.
            # Do this only after snapshot validation has completed.
            $global:LASTEXITCODE = 0
          }

      - name: Verify top-500 merge gates
        run: .\eng\readme-audit\Merge-TopReadmeAudit.Tests.ps1

      - name: Upload pinned corpus
        uses: actions/upload-artifact@v7
        with:
          name: readme-top500-corpus
          path: ${{ runner.temp }}/readme-corpus/top-repositories.json
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Audit ranks ${{ matrix.start }}-${{ matrix.end }}
    needs: corpus
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostic_rank == 0
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { start: 1, end: 25 }
          - { start: 26, end: 50 }
          - { start: 51, end: 75 }
          - { start: 76, end: 100 }
          - { start: 101, end: 125 }
          - { start: 126, end: 150 }
          - { start: 151, end: 175 }
          - { start: 176, end: 200 }
          - { start: 201, end: 225 }
          - { start: 226, end: 250 }
          - { start: 251, end: 275 }
          - { start: 276, end: 300 }
          - { start: 301, end: 325 }
          - { start: 326, end: 350 }
          - { start: 351, end: 375 }
          - { start: 376, end: 400 }
          - { start: 401, end: 425 }
          - { start: 426, end: 450 }
          - { start: 451, end: 475 }
          - { start: 476, end: 500 }
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Set up Node.js 22 for the Edge oracle
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Edge navigation, transport, and profile-lifetime contracts
        run: node --test .\eng\readme-audit\browser-launch.test.mjs .\eng\readme-audit\browser-navigation.test.mjs .\eng\readme-audit\browser-process-lifetime.test.mjs .\eng\readme-audit\cdp-client.test.mjs .\eng\readme-audit\same-byte-corpus.test.mjs .\eng\readme-audit\same-byte-edge-replay.test.mjs

      - name: Install pinned Windows App Runtime 1.8.10
        run: .\eng\readme-audit\Install-PinnedWindowsAppRuntime.ps1

      - name: Download pinned corpus
        uses: actions/download-artifact@v8
        with:
          name: readme-top500-corpus
          path: ${{ runner.temp }}/readme-corpus

      - name: Compare every README with GitHub in Edge
        env:
          AUDIT_CAPTURE_SAME_BYTE_CORPUS: ${{ inputs.same_byte_release }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'readme-audit'
          $shardCount = ${{ matrix.end }} - ${{ matrix.start }} + 1
          $arguments = @{
            StartRank = ${{ matrix.start }}
            Count = $shardCount
            Configuration = 'Release'
            ManifestPath = (Join-Path $env:RUNNER_TEMP 'readme-corpus\top-repositories.json')
            OutputRoot = $output
          }
          if ($env:AUDIT_CAPTURE_SAME_BYTE_CORPUS -eq 'true') {
            $arguments.CaptureSameByteCorpus = $true
          }
          .\eng\Invoke-TopReadmeAudit.ps1 @arguments

      - name: Enforce per-shard aggregate screenshot quota
        if: always()
        id: screenshot_quota
        env:
          AUDIT_CAPTURE_SAME_BYTE_CORPUS: ${{ inputs.same_byte_release }}
        run: |
          # This is an artifact-storage safety limit, not a fidelity threshold;
          # every expected browser/native tile is validated and uploaded.
          $output = Join-Path $env:RUNNER_TEMP 'readme-audit'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          . .\eng\readme-audit\Get-TopReadmeScreenshotEvidence.ps1
          $tileArguments = @{}
          if ($env:AUDIT_CAPTURE_SAME_BYTE_CORPUS -eq 'true') {
            $tileArguments.RequireSameByteTiles = $true
          }
          $screenshotEvidence = Get-TopReadmeScreenshotEvidence -AuditRoot $output @tileArguments
          $screenshotBytes = [long]$screenshotEvidence.screenshotBytes
          $screenshotCount = [int]$screenshotEvidence.screenshotCount
          $quotaBytes = [long]1073741824
          $withinQuota = $screenshotBytes -le $quotaBytes -and $screenshotCount -gt 0 -and
            $screenshotEvidence.caseTileValidationStatus -eq 'passed'
          $quotaReport = [ordered]@{
            schemaVersion = 1
            startRank = ${{ matrix.start }}
            endRank = ${{ matrix.end }}
            status = if ($withinQuota) { 'passed' } else { 'failed' }
            screenshotCount = $screenshotCount
            screenshotBytes = $screenshotBytes
            shardQuotaBytes = $quotaBytes
            caseTileValidationStatus = $screenshotEvidence.caseTileValidationStatus
            caseTileValidationFailureCount = $screenshotEvidence.caseTileValidationFailureCount
            caseTileValidationFailures = @($screenshotEvidence.caseTileValidationFailures)
          }
          $json = $quotaReport | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText(
            (Join-Path $output ("screenshot-quota-ranks-{0}-{1}.json" -f ${{ matrix.start }}, ${{ matrix.end }})),
            $json + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false))
          "within_quota=$($withinQuota.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          Write-Host "Shard screenshot evidence: $screenshotCount images, $screenshotBytes/$quotaBytes bytes."
          if (-not $withinQuota) {
            throw "Screenshot evidence is missing expected tiles, empty, or above the 1 GiB per-shard storage safety quota; full artifacts will still be retained for review."
          }

      - name: Capture WinUI crash metadata for failed audits
        if: failure()
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'readme-audit'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $result = [ordered]@{ Status = 'available'; Events = @() }
          try {
            $events = @(Get-WinEvent -FilterHashtable @{
              LogName = 'Application'
              ProviderName = 'Application Error'
              Id = 1000
              StartTime = (Get-Date).AddHours(-4)
            } -MaxEvents 512 -ErrorAction Stop)
            $matches = foreach ($event in $events) {
              [xml]$xml = $event.ToXml()
              $fields = @{}
              foreach ($entry in @($xml.Event.EventData.Data)) {
                if ($entry.Name) { $fields[[string]$entry.Name] = [string]$entry.'#text' }
              }
              if ($fields.AppName -ne 'JitHub.WinUI.exe') { continue }
              [ordered]@{
                TimeUtc = $event.TimeCreated.ToUniversalTime().ToString('O')
                FaultingModule = $fields.ModuleName
                ExceptionCode = $fields.ExceptionCode
                FaultingOffset = $fields.FaultingOffset
                ProcessId = $fields.ProcessId
              }
            }
            $result.Events = if ($null -eq $matches) { @() } else { @($matches) }
          }
          catch {
            # Event-log access is diagnostic only; it never waives the failed audit.
            if ($_.FullyQualifiedErrorId -match '^NoMatchingEventsFound') {
              $result.Status = 'no-events'
            }
            else {
              $result.Status = 'unavailable'
              $result.Reason = $_.Exception.GetType().Name
            }
          }
          $result | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $output 'crash-events.json')

      - name: Upload audit evidence for consolidation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-audit-evidence-${{ matrix.start }}-${{ matrix.end }}
          path: |
            ${{ runner.temp }}/readme-audit/summary.json
            ${{ runner.temp }}/readme-audit/summary.md
            ${{ runner.temp }}/readme-audit/app-binary-ranks-*.json
            ${{ runner.temp }}/readme-audit/screenshot-quota-ranks-*.json
            ${{ runner.temp }}/readme-audit/crash-events.json
            ${{ runner.temp }}/readme-audit/cases/**/result.json
            ${{ runner.temp }}/readme-audit/cases/**/browser/**
            ${{ runner.temp }}/readme-audit/cases/**/native/**
            !${{ runner.temp }}/readme-audit/cases/**/*.png
            !${{ runner.temp }}/readme-audit/cases/**/*.jpg
            !${{ runner.temp }}/readme-audit/cases/**/*.jpeg
            !${{ runner.temp }}/readme-audit/cases/**/*.webp
            !${{ runner.temp }}/readme-audit/cases/**/browser/same-byte-corpus-*/readme.md
            !${{ runner.temp }}/readme-audit/cases/**/browser/same-byte-corpus-*/rendered.html
            !${{ runner.temp }}/readme-audit/cases/**/browser/same-byte-corpus-*/assets/**
            !${{ runner.temp }}/readme-audit/cases/**/.runtime/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload complete visual screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-audit-visual-${{ matrix.start }}-${{ matrix.end }}
          path: |
            ${{ runner.temp }}/readme-audit/cases/**/browser/**/*.png
            ${{ runner.temp }}/readme-audit/cases/**/browser/**/*.jpg
            ${{ runner.temp }}/readme-audit/cases/**/browser/**/*.jpeg
            ${{ runner.temp }}/readme-audit/cases/**/browser/**/*.webp
            ${{ runner.temp }}/readme-audit/cases/**/native/**/*.png
            ${{ runner.temp }}/readme-audit/cases/**/native/**/*.jpg
            ${{ runner.temp }}/readme-audit/cases/**/native/**/*.jpeg
            ${{ runner.temp }}/readme-audit/cases/**/native/**/*.webp
            !${{ runner.temp }}/readme-audit/cases/**/browser/same-byte-corpus-*/assets/**
          if-no-files-found: error
          retention-days: 14

  consolidate:
    name: Consolidate all 500 results
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.diagnostic_rank == 0)
    needs: audit
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download pinned corpus for identity validation
        uses: actions/download-artifact@v8
        with:
          name: readme-top500-corpus
          path: ${{ runner.temp }}/readme-audit-corpus

      - name: Download every audit shard
        uses: actions/download-artifact@v8
        with:
          pattern: readme-audit-evidence-*
          path: ${{ runner.temp }}/readme-audit-shards
          merge-multiple: true

      - name: Require one complete top-500 verdict
        env:
          AUDIT_REQUIRE_SAME_BYTE_CORPUS: ${{ github.event_name == 'workflow_dispatch' && inputs.same_byte_release }}
          AUDIT_SHARDS_RESULT: ${{ needs.audit.result }}
        run: |
          $arguments = @{
            EvidenceRoot = (Join-Path $env:RUNNER_TEMP 'readme-audit-shards')
            ExpectedCount = 500
            PinnedManifestPath = (Join-Path $env:RUNNER_TEMP 'readme-audit-corpus\top-repositories.json')
            ShardWorkflowResult = $env:AUDIT_SHARDS_RESULT
            OutputDirectory = (Join-Path $env:RUNNER_TEMP 'readme-audit-consolidated')
          }
          if ($env:AUDIT_REQUIRE_SAME_BYTE_CORPUS -eq 'true') {
            $arguments.RequireSameByteCorpus = $true
          }
          .\eng\readme-audit\Merge-TopReadmeAudit.ps1 @arguments

      - name: Upload consolidated verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-audit-consolidated
          path: ${{ runner.temp }}/readme-audit-consolidated/**
          if-no-files-found: warn
          retention-days: 30

  diagnose:
    name: Replay rank ${{ inputs.diagnostic_rank }} with image diagnostics
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_rank > 0
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout requested renderer revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject a focused run requested as release evidence
        if: inputs.same_byte_release
        run: throw 'same_byte_release requires diagnostic_rank=0 so all 500 repositories run through the release gate.'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Set up Node.js 22 for the Edge oracle
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pinned Windows App Runtime 1.8.10
        run: .\eng\readme-audit\Install-PinnedWindowsAppRuntime.ps1

      - name: Download and validate the exact pinned corpus
        env:
          AUDIT_CORPUS_RUN_ID: ${{ inputs.diagnostic_corpus_run_id }}
          AUDIT_RANK: ${{ inputs.diagnostic_rank }}
          AUDIT_REPEATS: ${{ inputs.diagnostic_repeats }}
          AUDIT_PRIOR_CASES: ${{ inputs.diagnostic_prior_cases }}
        run: |
          $corpusRunId = 0L
          $rank = 0
          $repeats = 0
          $priorCases = 0
          if (-not [long]::TryParse($env:AUDIT_CORPUS_RUN_ID, [ref]$corpusRunId) -or $corpusRunId -le 0) {
            throw 'diagnostic_corpus_run_id must be a positive Actions run ID.'
          }
          if (-not [int]::TryParse($env:AUDIT_RANK, [ref]$rank) -or $rank -lt 1 -or $rank -gt 500) {
            throw 'diagnostic_rank must be between 1 and 500.'
          }
          if (-not [int]::TryParse($env:AUDIT_REPEATS, [ref]$repeats) -or $repeats -lt 1 -or $repeats -gt 5) {
            throw 'diagnostic_repeats must be between 1 and 5.'
          }
          if (-not [int]::TryParse($env:AUDIT_PRIOR_CASES, [ref]$priorCases) -or
              $priorCases -lt 0 -or $priorCases -gt 4 -or $priorCases -ge $rank) {
            throw 'diagnostic_prior_cases must be between 0 and 4 and less than diagnostic_rank.'
          }

          $corpusDirectory = Join-Path $env:RUNNER_TEMP 'readme-image-corpus'
          New-Item -ItemType Directory -Force -Path $corpusDirectory | Out-Null
          gh run download $corpusRunId --repo $env:GITHUB_REPOSITORY --name readme-top500-corpus --dir $corpusDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the requested pinned corpus.' }
          $raw = Join-Path $corpusDirectory 'top-repositories.json'
          $validated = Join-Path $corpusDirectory 'validated-top-repositories.json'
          .\eng\readme-audit\Copy-ValidatedTopReadmeManifest.ps1 `
            -SourcePath $raw -OutputPath $validated -ExpectedCount 500 -MaximumAgeDays 14
          "AUDIT_VALIDATED_CORPUS=$validated" >> $env:GITHUB_ENV
          "AUDIT_VALIDATED_RANK=$rank" >> $env:GITHUB_ENV
          "AUDIT_VALIDATED_REPEATS=$repeats" >> $env:GITHUB_ENV
          "AUDIT_VALIDATED_PRIOR_CASES=$priorCases" >> $env:GITHUB_ENV

      - name: Replay on the hosted runner with image diagnostics
        env:
          AUDIT_RASTER_DIAGNOSTICS: ${{ inputs.diagnostic_raster_stages }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'readme-image-diagnostic'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $failures = [Collections.Generic.List[string]]::new()
          for ($attempt = 1; $attempt -le [int]$env:AUDIT_VALIDATED_REPEATS; $attempt++) {
            $attemptOutput = Join-Path $output "attempt-$attempt"
            try {
              $arguments = @{
                StartRank = [int]$env:AUDIT_VALIDATED_RANK - [int]$env:AUDIT_VALIDATED_PRIOR_CASES
                Count = [int]$env:AUDIT_VALIDATED_PRIOR_CASES + 1
                Configuration = 'Release'
                ManifestPath = $env:AUDIT_VALIDATED_CORPUS
                OutputRoot = $attemptOutput
              }
              if ($env:AUDIT_RASTER_DIAGNOSTICS -eq 'true') {
                $arguments.RasterDiagnostics = $true
              }
              if ($attempt -gt 1) { $arguments.SkipBuild = $true }
              .\eng\Invoke-TopReadmeAudit.ps1 @arguments
            }
            catch {
              $failures.Add("Attempt ${attempt}: $($_.Exception.Message)")
              Write-Warning $failures[$failures.Count - 1]
            }
          }
          if ($failures.Count -gt 0) {
            throw "$($failures.Count) of $($env:AUDIT_VALIDATED_REPEATS) diagnostic replays failed. See the uploaded evidence."
          }

      - name: Upload all diagnostic evidence, including failed attempts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-image-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/readme-image-diagnostic
          if-no-files-found: warn
          retention-days: 14
