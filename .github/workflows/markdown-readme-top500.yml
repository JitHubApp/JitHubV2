name: Top 500 README browser parity

on:
  pull_request:
    paths:
      - ".github/workflows/markdown-readme-top500.yml"
      - "eng/Invoke-TopReadmeAudit.ps1"
      - "eng/readme-audit/**"
      - "JitHub.WinUI/**"
      - "JitHub.WinUI.Automation/**"
      - "MarkdownRenderer/**"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-readme-top500-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  DOTNET_NOLOGO: "true"
  MSBUILDDISABLENODEREUSE: "1"
  NUGET_XMLDOC_MODE: skip
  GH_TOKEN: ${{ github.token }}

jobs:
  corpus:
    name: Pin the current top-500 corpus
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate immutable repository and README manifest
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'readme-corpus\top-repositories.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $output) | Out-Null
          try {
            .\eng\readme-audit\New-TopReadmeManifest.ps1 -Count 500 -OutputPath $output
          }
          catch {
            # The ephemeral GITHUB_TOKEN can occasionally be unavailable to
            # gh even though Actions injected it (for example while GitHub is
            # rotating an installation token). Treat that the same as a
            # metadata rate limit: use only the recent, rigorously validated
            # immutable snapshot. Parsing, validation, and integrity failures
            # remain fatal and cannot silently fall back.
            if ($_.Exception.ToString() -notmatch '(?i)(rate limit exceeded|GitHub CLI must be authenticated)') {
              throw
            }

            Write-Warning "Live GitHub corpus metadata is temporarily unavailable: $($_.Exception.Message)"
            Write-Warning 'Using the recent checked-in immutable snapshot after strict validation.'
            .\eng\readme-audit\Copy-ValidatedTopReadmeManifest.ps1 `
              -SourcePath '.\eng\readme-audit\pinned-top500.json' `
              -OutputPath $output `
              -ExpectedCount 500 `
              -MaximumAgeDays 14

            # PowerShell preserves the most recent native process exit code
            # even after its exception is handled and later cmdlets succeed.
            # Do this only after snapshot validation has completed.
            $global:LASTEXITCODE = 0
          }

      - name: Upload pinned corpus
        uses: actions/upload-artifact@v7
        with:
          name: readme-top500-corpus
          path: ${{ runner.temp }}/readme-corpus/top-repositories.json
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Audit ranks ${{ matrix.start }}-${{ matrix.end }}
    needs: corpus
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { start: 1, end: 25 }
          - { start: 26, end: 50 }
          - { start: 51, end: 75 }
          - { start: 76, end: 100 }
          - { start: 101, end: 125 }
          - { start: 126, end: 150 }
          - { start: 151, end: 175 }
          - { start: 176, end: 200 }
          - { start: 201, end: 225 }
          - { start: 226, end: 250 }
          - { start: 251, end: 275 }
          - { start: 276, end: 300 }
          - { start: 301, end: 325 }
          - { start: 326, end: 350 }
          - { start: 351, end: 375 }
          - { start: 376, end: 400 }
          - { start: 401, end: 425 }
          - { start: 426, end: 450 }
          - { start: 451, end: 475 }
          - { start: 476, end: 500 }
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Set up Node.js 22 for the Edge oracle
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Edge navigation and profile-lifetime contracts
        run: node --test .\eng\readme-audit\browser-launch.test.mjs .\eng\readme-audit\browser-navigation.test.mjs .\eng\readme-audit\browser-process-lifetime.test.mjs

      - name: Install pinned Windows App Runtime 1.8.10
        run: |
          # JitHub is framework-dependent in production. GitHub-hosted Windows
          # images do not guarantee the matching Windows App Runtime, and the
          # bootstrapper's missing-runtime UI cannot satisfy an unattended job.
          # Microsoft documents --quiet as the supported silent deployment path:
          # https://learn.microsoft.com/windows/apps/windows-app-sdk/deploy-unpackaged-apps
          $uri = 'https://aka.ms/windowsappsdk/1.8/1.8.260710003/windowsappruntimeinstall-x64.exe'
          $expectedSha256 = 'B8CDA840267AB72797F654F801F9A064AB6D9E508CEDEE3DF79F772F104DB6D6'
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-1.8.260710003-x64.exe'
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "Windows App Runtime installer hash mismatch: $actualSha256"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '--quiet' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows App Runtime installer failed with exit code $($process.ExitCode)."
          }
          $runtime = Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime.1.8' |
            Where-Object Architecture -eq 'X64' |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if ($null -eq $runtime -or [version]$runtime.Version -lt [version]'8000.921.1539.0') {
            throw 'The pinned x64 Windows App Runtime 1.8.10 was not installed.'
          }
          $packageFamilies = @(Get-AppxPackage | Select-Object -ExpandProperty PackageFamilyName -Unique)
          $requiredFamilies = @(
            'Microsoft.WindowsAppRuntime.1.8_8wekyb3d8bbwe',
            'MicrosoftCorporationII.WinAppRuntime.Main.1.8_8wekyb3d8bbwe',
            'MicrosoftCorporationII.WinAppRuntime.Singleton_8wekyb3d8bbwe',
            'Microsoft.WinAppRuntime.DDLM.8000.921.1539.0-x6_8wekyb3d8bbwe'
          )
          $missingFamilies = @($requiredFamilies | Where-Object { $_ -notin $packageFamilies })
          if ($missingFamilies.Count -ne 0) {
            throw "Windows App Runtime installation is incomplete: $($missingFamilies -join ', ')"
          }
          Write-Host "Using Windows App Runtime $($runtime.Version) ($($runtime.Architecture))."

      - name: Download pinned corpus
        uses: actions/download-artifact@v8
        with:
          name: readme-top500-corpus
          path: ${{ runner.temp }}/readme-corpus

      - name: Compare every README with GitHub in Edge
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'readme-audit'
          $shardCount = ${{ matrix.end }} - ${{ matrix.start }} + 1
          .\eng\Invoke-TopReadmeAudit.ps1 `
            -StartRank ${{ matrix.start }} `
            -Count $shardCount `
            -Configuration Release `
            -ManifestPath (Join-Path $env:RUNNER_TEMP 'readme-corpus\top-repositories.json') `
            -OutputRoot $output

      - name: Upload full-page evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-audit-${{ matrix.start }}-${{ matrix.end }}
          path: |
            ${{ runner.temp }}/readme-audit/summary.json
            ${{ runner.temp }}/readme-audit/summary.md
            ${{ runner.temp }}/readme-audit/cases/**/result.json
            ${{ runner.temp }}/readme-audit/cases/**/browser/**
            ${{ runner.temp }}/readme-audit/cases/**/native/**
            !${{ runner.temp }}/readme-audit/cases/**/.runtime/**
          if-no-files-found: warn
          retention-days: 14

  consolidate:
    name: Consolidate all 500 results
    if: always()
    needs: audit
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download every audit shard
        uses: actions/download-artifact@v8
        with:
          pattern: readme-audit-*
          path: ${{ runner.temp }}/readme-audit-shards
          merge-multiple: true

      - name: Require one complete top-500 verdict
        run: |
          .\eng\readme-audit\Merge-TopReadmeAudit.ps1 `
            -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'readme-audit-shards') `
            -ExpectedCount 500 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'readme-audit-consolidated')

      - name: Upload consolidated verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-audit-consolidated
          path: ${{ runner.temp }}/readme-audit-consolidated/**
          if-no-files-found: warn
          retention-days: 30
