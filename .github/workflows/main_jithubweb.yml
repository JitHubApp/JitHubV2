name: Build and deploy JitHub website

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main_jithubweb.yml'
      - 'JitHub.Web/**'
      - 'JitHub.Web.Tests/**'
      - 'Shared/OAuthHandoffProtocol.cs'
      - 'global.json'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/main_jithubweb.yml'
      - 'JitHub.Web/**'
      - 'JitHub.Web.Tests/**'
      - 'Shared/OAuthHandoffProtocol.cs'
      - 'global.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: ${{ vars.JITHUB_WEBAPP_NAME || 'jithub-web-prod' }}
  WEBSITE_PROJECT: JitHub.Web/JitHub.Web.csproj
  WEBSITE_TEST_PROJECT: JitHub.Web.Tests/JitHub.Web.Tests.csproj

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Restore website dependencies
        run: dotnet restore ./${{ env.WEBSITE_TEST_PROJECT }} --locked-mode

      - name: Test website
        run: dotnet test ./${{ env.WEBSITE_TEST_PROJECT }} --configuration Release --no-restore --property:TreatWarningsAsErrors=true

      - name: Publish website
        run: dotnet publish ./${{ env.WEBSITE_PROJECT }} --configuration Release --no-restore --output ./publish --property:TreatWarningsAsErrors=true

      - name: Smoke test production startup
        shell: bash
        run: |
          log_file="${RUNNER_TEMP}/jithub-web-production.log"
          ASPNETCORE_ENVIRONMENT=Production \
          WEBSITE_HOSTNAME=jithub-web-prod.azurewebsites.net \
          ASPNETCORE_URLS=http://127.0.0.1:5088 \
            dotnet ./publish/JitHub.Web.dll >"${log_file}" 2>&1 &
          web_pid=$!
          cleanup() {
            if kill -0 "${web_pid}" 2>/dev/null; then
              kill "${web_pid}"
              wait "${web_pid}" || true
            fi
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if ! kill -0 "${web_pid}" 2>/dev/null; then
              cat "${log_file}"
              exit 1
            fi

            if [ "$(curl --silent --show-error --fail --max-time 2 http://127.0.0.1:5088/healthz || true)" = "ok" ]; then
              exit 0
            fi

            sleep 1
          done

          cat "${log_file}"
          echo "Production startup health check timed out."
          exit 1

      - name: Upload published website
        uses: actions/upload-artifact@v4
        with:
          name: jithub-web-publish
          path: ./publish
          if-no-files-found: error

  deploy:
    name: Deploy website
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download published website
        uses: actions/download-artifact@v4
        with:
          name: jithub-web-publish
          path: ./publish

      - name: Validate Azure Web App deployment configuration
        shell: bash
        env:
          JITHUB_WEBAPP_PUBLISH_PROFILE: ${{ secrets.JITHUB_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "${AZURE_WEBAPP_NAME}" ]; then
            echo "JITHUB_WEBAPP_NAME is empty. Configure the repository variable or set AZURE_WEBAPP_NAME in the workflow."
            exit 1
          fi

          if [ -z "${JITHUB_WEBAPP_PUBLISH_PROFILE}" ]; then
            echo "JITHUB_WEBAPP_PUBLISH_PROFILE is required. Create a regular Azure App Service Web App, download its publish profile, and save it as this GitHub secret."
            exit 1
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.JITHUB_WEBAPP_PUBLISH_PROFILE }}

      - name: Verify deployed website health
        shell: bash
        env:
          JITHUB_WEBAPP_HEALTH_URL: ${{ vars.JITHUB_WEBAPP_HEALTH_URL }}
        run: |
          health_url="${JITHUB_WEBAPP_HEALTH_URL:-https://${AZURE_WEBAPP_NAME}.azurewebsites.net/healthz}"
          for attempt in {1..30}; do
            if [ "$(curl --silent --show-error --fail --max-time 10 "${health_url}" || true)" = "ok" ]; then
              echo "Production website is healthy at ${health_url}."
              exit 0
            fi

            sleep 10
          done

          echo "Production website did not become healthy at ${health_url}."
          exit 1
