      - name: Restore legacy dependency license evidence in locked mode
        run: |
          # Release restores verify the committed lock; Debug restores use an
          # obj-local lock file under the repository policy.
          & dotnet restore '.\MarkdownRenderer\eng\ComplianceDependencyRestore\ComplianceDependencyRestore.csproj' `
            -p:Configuration=$env:CONFIGURATION `
            --locked-mode `
            --disable-build-servers
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed for compliance dependency evidence.' }

      - name: Pack every shipping package twice into clean directories
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'markdownrenderer-preview'
          $evidenceRoot = Join-Path $artifactRoot 'package-rebuild-evidence'
          $targetFramework = 'net10.0-windows10.0.26100.0'
          $packageDirectories = @(
            (Join-Path $artifactRoot 'packages-reference')
            (Join-Path $artifactRoot 'packages-candidate'))
          # Both passes compile through one shared compiler server. The CsWinRT
          # AOT generator orders its output by string hash codes, which .NET
          # randomizes per process (https://github.com/microsoft/CsWinRT/issues/2562),
          # so two compiler processes emit different MarkdownRenderer.dll bytes
          # from the same inputs. One server process keeps that order identical.
          # The check still rebuilds every project from scratch in each pass.
          # Revert to separate compiler processes once that issue is fixed.
          & dotnet build-server shutdown --vbcscompiler
          $compilerServerIds = @{}
          $projects = @(
            '.\MarkdownRenderer\src\MarkdownRenderer.Core\MarkdownRenderer.Core.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer\MarkdownRenderer.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Performance\MarkdownRenderer.Performance.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Package\MarkdownRenderer.Package.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Gfm\MarkdownRenderer.Gfm.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Html\MarkdownRenderer.Html.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Math\MarkdownRenderer.Math.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Mermaid\MarkdownRenderer.Mermaid.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Svg.Resvg\MarkdownRenderer.Svg.Resvg.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.SyntaxHighlighting.TextMate\MarkdownRenderer.SyntaxHighlighting.TextMate.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.SyntaxHighlighting.TextMate.Grammars.Common\MarkdownRenderer.SyntaxHighlighting.TextMate.Grammars.Common.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.SyntaxHighlighting.TextMate.Grammars.All\MarkdownRenderer.SyntaxHighlighting.TextMate.Grammars.All.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.GitHub\MarkdownRenderer.GitHub.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.All\MarkdownRenderer.All.csproj'
          )
          foreach ($packageDirectory in $packageDirectories) {
            if (@(Get-ChildItem -LiteralPath $packageDirectory -Force).Count -ne 0) {
              throw "Package directory was not clean before packing: $packageDirectory"
            }

            $passName = Split-Path -Leaf $packageDirectory
            $passEvidenceDirectory = Join-Path $evidenceRoot $passName
            $binlogDirectory = Join-Path $passEvidenceDirectory 'binlogs'
            $generatedRoot = Join-Path $passEvidenceDirectory 'generated-source'
            New-Item -ItemType Directory -Path $binlogDirectory -Force | Out-Null
            New-Item -ItemType Directory -Path $generatedRoot -Force | Out-Null

            # Rebuild every shipping project once in validated topological order.
            # Project references are consumed from the earlier rebuilds, avoiding
            # repeated dependency compilation and cross-project output races.
            $rebuildResults = [System.Collections.Generic.List[object]]::new()
            $rebuildFailure = $null
            try {
              $shippingProjectPaths = [System.Collections.Generic.HashSet[string]]::new(
                [System.StringComparer]::OrdinalIgnoreCase)
              foreach ($project in $projects) {
                $projectPath = (Resolve-Path -LiteralPath $project).Path
                if (-not $shippingProjectPaths.Add($projectPath)) {
                  throw "Shipping project is listed more than once: '$project'."
                }
              }

              $rebuiltProjectPaths = [System.Collections.Generic.HashSet[string]]::new(
                [System.StringComparer]::OrdinalIgnoreCase)
              foreach ($project in $projects) {
                $projectPath = (Resolve-Path -LiteralPath $project).Path
                [xml]$projectXml = Get-Content -LiteralPath $projectPath -Raw
                $projectDirectory = Split-Path -Parent $projectPath
                foreach ($reference in $projectXml.SelectNodes("//*[local-name()='ProjectReference']")) {
                  $include = $reference.GetAttribute('Include')
                  if ([string]::IsNullOrWhiteSpace($include)) { continue }
                  if ($include -match '[*?]' -or $include -match '\$\(|@\(|%\(') {
                    throw "Unsupported MSBuild expression or wildcard in ProjectReference '$include' from '$project'."
                  }
                  $referencePath = [IO.Path]::GetFullPath((Join-Path $projectDirectory $include))
                  if (-not $shippingProjectPaths.Contains($referencePath)) {
                    throw "Shipping project '$project' references unlisted project '$include'; add it to the shipping rebuild and package list."
                  }
                  if (-not $rebuiltProjectPaths.Contains($referencePath)) {
                    throw "Shipping project order is not topological: '$project' references '$include' before it is rebuilt."
                  }
                }
                $rebuiltProjectPaths.Add($projectPath) | Out-Null
              }
              if ($rebuiltProjectPaths.Count -ne $shippingProjectPaths.Count) {
                throw 'The shipping graph validation did not visit every project exactly once.'
              }
            }
            catch {
              $rebuildFailure = "Shipping graph order validation failed: $($_.Exception.Message)"
            }

            if ($null -eq $rebuildFailure) {
              foreach ($project in $projects) {
                $projectPath = (Resolve-Path -LiteralPath $project).Path
                $projectName = [IO.Path]::GetFileNameWithoutExtension($projectPath)
                $binlogPath = Join-Path $binlogDirectory ("{0}.binlog" -f $projectName)
                $exitCode = -1
                try {
                  & dotnet build $project `
                    --configuration $env:CONFIGURATION `
                    -p:Platform=$env:PLATFORM `
                    -p:UseSharedCompilation=true `
                    -p:UseRazorBuildServer=false `
                    -p:BuildInParallel=false `
                    -p:BuildProjectReferences=false `
                    -p:EmitCompilerGeneratedFiles=true `
                    -target:Rebuild `
                    --no-restore `
                    -nodeReuse:false `
                    "-bl:$binlogPath" `
                    -m:1
                  $exitCode = $LASTEXITCODE
                }
                catch {
                  $rebuildFailure = "Shipping graph rebuild could not run for '$project': $($_.Exception.Message)"
                }

                $rebuildResults.Add([pscustomobject][ordered]@{
                  project = $project
                  exitCode = $exitCode
                  binlog = [IO.Path]::GetFileName($binlogPath)
                })
                if ($null -ne $rebuildFailure) { break }
                if ($exitCode -ne 0) {
                  $rebuildFailure = "Shipping graph rebuild failed for '$project' with exit code $exitCode."
                  break
                }
              }
            }

            # Preserve the per-project generator output after both successful
            # and failed rebuilds. This is diagnostic evidence, not a shared
            # CompilerGeneratedFilesOutputPath, so project outputs cannot race
            # or overwrite one another.
            foreach ($project in $projects) {
              try {
                $projectPath = (Resolve-Path -LiteralPath $project).Path
                $projectDirectory = Split-Path -Parent $projectPath
                $projectName = [IO.Path]::GetFileNameWithoutExtension($projectPath)
                $generatedDirectory = Join-Path $projectDirectory (
                  "obj\{0}\{1}\{2}\generated" -f $env:PLATFORM, $env:CONFIGURATION, $targetFramework)
                if (-not (Test-Path -LiteralPath $generatedDirectory -PathType Container)) { continue }

                $projectCapturePath = Join-Path $generatedRoot $projectName
                New-Item -ItemType Directory -Path $projectCapturePath -Force | Out-Null
                Get-ChildItem -LiteralPath $generatedDirectory -Force |
                  Copy-Item -Destination $projectCapturePath -Recurse -Force
              }
              catch {
                Write-Warning "Could not preserve generated-source evidence for '$project': $($_.Exception.Message)"
              }
            }

            $serverIds = @(Get-Process -Name VBCSCompiler -ErrorAction SilentlyContinue |
              ForEach-Object Id | Sort-Object)
            $compilerServerIds[$passName] = $serverIds -join ','
            if ($null -eq $rebuildFailure -and $serverIds.Count -ne 1) {
              $rebuildFailure = "Expected one shared compiler server after '$passName', found $($serverIds.Count)."
            }
            if ($null -eq $rebuildFailure -and $compilerServerIds.Count -eq 2 -and
                @($compilerServerIds.Values | Sort-Object -Unique).Count -ne 1) {
              $rebuildFailure = 'The compiler server restarted between the two packing passes.'
            }

            $rebuildReport = [pscustomobject][ordered]@{
              schemaVersion = 1
              pass = $passName
              generatedUtc = [DateTime]::UtcNow.ToString('O', [Globalization.CultureInfo]::InvariantCulture)
              compilerServerProcessIds = $compilerServerIds[$passName]
              projects = $rebuildResults
              failure = $rebuildFailure
            }
            [IO.File]::WriteAllText(
              (Join-Path $passEvidenceDirectory 'shipping-graph-rebuild.json'),
              ($rebuildReport | ConvertTo-Json -Depth 5) + "`n",
              [Text.UTF8Encoding]::new($false))
            if ($null -ne $rebuildFailure) { throw $rebuildFailure }

            foreach ($project in $projects) {
              & dotnet pack $project `
                --configuration $env:CONFIGURATION `
                -p:Platform=$env:PLATFORM `
                -p:UseSharedCompilation=false `
                -p:BuildInParallel=false `
                --no-restore `
                --no-build `
                --disable-build-servers `
                --output $packageDirectory `
                -m:1
              if ($LASTEXITCODE -ne 0) { throw "Pack failed for '$project' into '$packageDirectory'." }
            }

            .\MarkdownRenderer\eng\Normalize-NuGetPackageArchives.ps1 `
              -PackageDirectory $packageDirectory

            $packages = @(Get-ChildItem -LiteralPath $packageDirectory -Filter '*.nupkg' -File |
              Where-Object { $_.Name -notlike '*.symbols.nupkg' })
            if ($packages.Count -ne $projects.Count) {
              throw "Expected $($projects.Count) shipping packages in '$packageDirectory', found $($packages.Count)."
            }
          }
          & dotnet build-server shutdown --vbcscompiler

      - name: Upload package rebuild reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markdownrenderer-preview-package-rebuild-evidence
          path: ${{ runner.temp }}/markdownrenderer-preview/package-rebuild-evidence/**
          if-no-files-found: warn
          retention-days: 7

      - name: Consume managed packages in NativeAOT and trimmed single-file deployments
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          function Get-PeMachine([string] $path) {
            $bytes = [IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "'$path' is not an MZ executable."
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or
                $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) {
              throw "'$path' has no valid PE signature."
            }
            switch ([BitConverter]::ToUInt16($bytes, $peOffset + 4)) {
              332 { return 'x86' }
              34404 { return 'x64' }
              43620 { return 'arm64' }
              default { throw "'$path' has an unexpected PE machine type." }
            }
          }

          $artifactRoot = Join-Path $env:RUNNER_TEMP 'markdownrenderer-preview'
          $packageDirectory = Join-Path $artifactRoot 'packages-candidate'
          $evidenceDirectory = Join-Path $artifactRoot 'managed-pack-evidence'
          $packagesCache = Join-Path $evidenceDirectory 'packages-cache'
          $smoke = '.\MarkdownRenderer\tests\aot\MarkdownRenderer.ManagedPacks.AotSmoke\MarkdownRenderer.ManagedPacks.AotSmoke.csproj'
          $managedPackageIds = @(
            'MarkdownRenderer'
            'MarkdownRenderer.Core'
            'MarkdownRenderer.WinUI'
            'MarkdownRenderer.Performance'
            'MarkdownRenderer.Gfm'
            'MarkdownRenderer.GitHub'
            'MarkdownRenderer.Html'
          )

          $archives = @()
          foreach ($id in $managedPackageIds) {
            # The package ID must be followed by a numeric version. A glob
            # for MarkdownRenderer.* also matches every subpackage and makes
            # the meta-package look duplicated.
            $escapedId = [regex]::Escape($id)
            $matches = @(Get-ChildItem -LiteralPath $packageDirectory -Filter '*.nupkg' -File |
              Where-Object {
                $_.Name -notlike '*.symbols.nupkg' -and
                $_.Name -match "^${escapedId}\.[0-9][0-9A-Za-z.+-]*\.nupkg$"
              })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one managed package for '$id'; found $($matches.Count)."
            }
            $archive = [IO.Compression.ZipFile]::OpenRead($matches[0].FullName)
            try {
              if (-not @($archive.Entries | Where-Object { $_.FullName -eq "$id.nuspec" }).Count) {
                throw "Managed package '$id' does not contain its exact-ID nuspec."
              }
              $nativePayload = @($archive.Entries | Where-Object { $_.FullName -match '^runtimes/.+/native/' })
              if ($nativePayload.Count -ne 0) {
                throw "Managed package '$id' unexpectedly contains native payload: $($nativePayload.FullName -join ', ')."
              }
              $archives += [pscustomobject][ordered]@{
                id = $id
                path = $matches[0].FullName
                compressedBytes = $matches[0].Length
                sha256 = (Get-FileHash -LiteralPath $matches[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
            finally {
              $archive.Dispose()
            }
          }

          $metaArchive = [IO.Compression.ZipFile]::OpenRead(($archives | Where-Object id -eq 'MarkdownRenderer').path)
          try {
            $nuspec = $metaArchive.GetEntry('MarkdownRenderer.nuspec')
            if ($null -eq $nuspec) { throw 'Managed meta-package has no nuspec.' }
            $reader = [IO.StreamReader]::new($nuspec.Open())
            try { $packageVersion = [string] ([xml] $reader.ReadToEnd()).package.metadata.version }
            finally { $reader.Dispose() }
          }
          finally {
            $metaArchive.Dispose()
          }
          if ([string]::IsNullOrWhiteSpace($packageVersion)) { throw 'Managed meta-package has no version.' }

          $mtRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $mt = Get-ChildItem -LiteralPath $mtRoot -Filter 'mt.exe' -File -Recurse |
            Where-Object { $_.DirectoryName -match '\\x64$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $mt) { throw "Windows SDK manifest tool was not found under '$mtRoot'." }
          $env:PATH = "$($mt.DirectoryName);$env:PATH"

          $hostArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $matrix = @(
            [pscustomobject]@{ Platform = 'x86'; Rid = 'win-x86'; Machine = 'x86' },
            [pscustomobject]@{ Platform = 'x64'; Rid = 'win-x64'; Machine = 'x64' },
            [pscustomobject]@{ Platform = 'ARM64'; Rid = 'win-arm64'; Machine = 'arm64' }
          )
          $deployments = @()
          foreach ($target in $matrix) {
            foreach ($mode in @('nativeaot', 'trimmed-single-file')) {
              $lane = "$mode-$($target.Rid)"
              $lockPath = Join-Path $evidenceDirectory "$lane.lock.json"
              $publishDirectory = Join-Path $evidenceDirectory $lane
              $publishProperties = @(
                "-p:Platform=$($target.Platform)",
                "-p:ManagedPacksPackageVersion=$packageVersion",
                "-p:RestoreAdditionalProjectSources=$packageDirectory",
                '-p:RestorePackagesWithLockFile=false',
                '-p:RestoreLockedMode=false',
                "-p:NuGetLockFilePath=$lockPath",
                "-p:RestorePackagesPath=$packagesCache",
                '-p:UseSharedCompilation=false'
              )
              if ($mode -eq 'nativeaot') {
                $publishProperties += '-p:PublishAot=true'
              }
              else {
                $publishProperties += @(
                  '-p:PublishAot=false',
                  '-p:PublishTrimmed=true',
                  '-p:TrimMode=full',
                  '-p:PublishSingleFile=true'
                )
              }

              & dotnet restore $smoke -p:Configuration=$env:CONFIGURATION --runtime $target.Rid `
                @publishProperties --no-cache --disable-parallel --disable-build-servers
              if ($LASTEXITCODE -ne 0) { throw "Managed package restore failed for '$lane'." }

              & dotnet publish $smoke --configuration $env:CONFIGURATION --runtime $target.Rid `
                --self-contained true --no-restore --disable-build-servers --output $publishDirectory @publishProperties
              if ($LASTEXITCODE -ne 0) { throw "Managed package publish failed for '$lane'." }

              $executable = Join-Path $publishDirectory 'MarkdownRenderer.ManagedPacks.AotSmoke.exe'
              if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
                throw "Managed package publish did not produce '$executable'."
              }
              $machine = Get-PeMachine $executable
              if ($machine -ne $target.Machine) {
                throw "Managed package $lane executable is $machine; expected $($target.Machine)."
              }

              $executed = $false
              $output = $null
              $skipReason = $null
              if ($target.Rid -eq ('win-' + $hostArchitecture) -or
                  ($hostArchitecture -eq 'x64' -and $target.Rid -eq 'win-x86')) {
                $output = @(& $executable 2>&1) -join "`n"
                if ($LASTEXITCODE -ne 0) { throw "Managed package smoke failed for '$lane': $output" }
                if ($output -notmatch '^gfm-0\.29;github-readme;safe-html-v1$') {
                  throw "Managed package smoke returned an unexpected contract for '$lane': $output"
                }
                $executed = $true
              }
              else {
                $skipReason = "Cross-published $($target.Rid) output cannot execute on the $hostArchitecture CI host."
              }
              $deployments += [pscustomobject][ordered]@{
                mode = $mode
                rid = $target.Rid
                executableMachine = $machine
                executableBytes = (Get-Item -LiteralPath $executable).Length
                executed = $executed
                output = $output
                skipReason = $skipReason
              }
            }
          }

          $report = [pscustomobject][ordered]@{
            schemaVersion = 1
            generatedUtc = [DateTime]::UtcNow.ToString('O', [Globalization.CultureInfo]::InvariantCulture)
            hostArchitecture = $hostArchitecture
            packageVersion = $packageVersion
            packages = $archives
            deployments = $deployments
          }
          $reportPath = Join-Path $evidenceDirectory 'managed-package-release-evidence.json'
          [IO.File]::WriteAllText($reportPath, ($report | ConvertTo-Json -Depth 10) + "`n", [Text.UTF8Encoding]::new($false))

      - name: Test package compliance tooling
        run: .\MarkdownRenderer\eng\Test-PackageComplianceTools.ps1

      - name: Run strict package compliance
        run: |
          $complianceDirectory = Join-Path $env:RUNNER_TEMP 'markdownrenderer-preview\compliance'
          $referenceManifest = Join-Path $complianceDirectory 'package-reproducibility-reference.json'
          .\MarkdownRenderer\eng\New-PackageReproducibilityManifest.ps1 `
            -PackageDirectory (Join-Path $env:RUNNER_TEMP 'markdownrenderer-preview\packages-reference') `
            -OutputPath $referenceManifest

          .\MarkdownRenderer\eng\Invoke-PackageCompliance.ps1 `
            -PackageDirectory (Join-Path $env:RUNNER_TEMP 'markdownrenderer-preview\packages-candidate') `
            -OutputDirectory $complianceDirectory `
            -ReferenceManifest $referenceManifest `
            -FailOnUnknownLicense

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markdownrenderer-preview-test-results
          path: ${{ runner.temp }}/markdownrenderer-preview/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Upload shipping packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markdownrenderer-preview-packages
          path: ${{ runner.temp }}/markdownrenderer-preview/packages-candidate/*.nupkg
          if-no-files-found: warn
          retention-days: 7

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markdownrenderer-preview-benchmarks
          path: ${{ runner.temp }}/markdownrenderer-preview/benchmarks/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload package compliance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markdownrenderer-preview-compliance
          path: ${{ runner.temp }}/markdownrenderer-preview/compliance/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload managed package release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markdownrenderer-preview-managed-package-evidence
          path: ${{ runner.temp }}/markdownrenderer-preview/managed-pack-evidence/**
          if-no-files-found: warn
          retention-days: 7
