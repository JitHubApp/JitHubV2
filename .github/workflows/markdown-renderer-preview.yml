            if ($LASTEXITCODE -ne 0) { throw "NativeAOT smoke failed for '$($smoke.Name)'." }
          }

      - name: Restore every shipping package in locked mode
        run: |
          $projects = @(
            '.\MarkdownRenderer\src\MarkdownRenderer.Core\MarkdownRenderer.Core.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer\MarkdownRenderer.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Performance\MarkdownRenderer.Performance.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Package\MarkdownRenderer.Package.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Gfm\MarkdownRenderer.Gfm.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Html\MarkdownRenderer.Html.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Math\MarkdownRenderer.Math.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Mermaid\MarkdownRenderer.Mermaid.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.Svg.Resvg\MarkdownRenderer.Svg.Resvg.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.SyntaxHighlighting.TextMate\MarkdownRenderer.SyntaxHighlighting.TextMate.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.SyntaxHighlighting.TextMate.Grammars.Common\MarkdownRenderer.SyntaxHighlighting.TextMate.Grammars.Common.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.SyntaxHighlighting.TextMate.Grammars.All\MarkdownRenderer.SyntaxHighlighting.TextMate.Grammars.All.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.GitHub\MarkdownRenderer.GitHub.csproj'
            '.\MarkdownRenderer\src\MarkdownRenderer.All\MarkdownRenderer.All.csproj'
          )
          foreach ($project in $projects) {
