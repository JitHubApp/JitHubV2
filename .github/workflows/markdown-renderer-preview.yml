name: MarkdownRenderer Preview Validation

# Hosted CI does not run pinned-machine ETW traces, live UI Automation, or
# native ARM64 execution, and must not claim their results.

on:
  push:
    branches:
      - main
    paths:
      - MarkdownRenderer/**
      - JitHub.WinUI/**
      - JitHub.WinUI.Tests/**
      - docs/markdown-renderer/**
      - JitHub.slnx
      - .github/workflows/markdown-renderer-preview.yml
      - Directory.Build.props
      - .gitattributes
      - global.json
      - LICENSE
      - NuGet.config
  pull_request:
    branches:
      - main
    paths:
      - MarkdownRenderer/**
      - JitHub.WinUI/**
      - JitHub.WinUI.Tests/**
      - docs/markdown-renderer/**
      - JitHub.slnx
      - .github/workflows/markdown-renderer-preview.yml
      - Directory.Build.props
      - .gitattributes
      - global.json
      - LICENSE
      - NuGet.config
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-renderer-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  DOTNET_NOLOGO: "true"
  MSBUILDDISABLENODEREUSE: "1"
  NUGET_XMLDOC_MODE: skip
  CONFIGURATION: Release
  PLATFORM: x64
  RID: win-x64
  BENCHMARK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

jobs:
  preview-validation:
    name: Test, benchmark, consume, NativeAOT, pack, and inspect
    runs-on: windows-latest
    # The external-gate fixture deliberately validates hundreds of hostile
    # report mutations in isolated PowerShell processes. Hosted Windows
    # runners can spend more than an hour in that exhaustive contract suite,
    # so leave enough time for the independent package/AOT gates that follow.
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Rebuild and verify every pinned resvg worker
        run: |
          $manifest = '.\MarkdownRenderer\src\MarkdownRenderer.Svg.Resvg\native\Cargo.toml'
          $validationTarget = 'x86_64-pc-windows-msvc'
          $workerTargets = [ordered]@{
            'i686-pc-windows-msvc' = 'win-x86'
            'x86_64-pc-windows-msvc' = 'win-x64'
            'aarch64-pc-windows-msvc' = 'win-arm64'
          }
          & rustup toolchain install 1.96.0 --profile minimal --component clippy --target $validationTarget
          if ($LASTEXITCODE -ne 0) { throw 'The pinned Rust 1.96.0 toolchain could not be installed.' }
          foreach ($target in $workerTargets.Keys) {
            & rustup target add --toolchain 1.96.0 $target
            if ($LASTEXITCODE -ne 0) { throw "The pinned Rust target $target could not be installed." }
          }

          # The offline SBOM verifier inventories every target-conditional
          # dependency in Cargo.lock, not only packages selected by the x64
          # validation build. Preload the complete locked graph accordingly.
          & cargo +1.96.0 fetch --manifest-path $manifest --locked
          if ($LASTEXITCODE -ne 0) { throw 'The pinned resvg dependency graph could not be fetched.' }
          & cargo +1.96.0 test --manifest-path $manifest --locked --workspace --target $validationTarget
          if ($LASTEXITCODE -ne 0) { throw 'The isolated resvg worker tests failed.' }
          # Keep the original strict worker bin/test lint gate. Vendored crates
          # joined the workspace for the full test suite above, not to rewrite
          # their unrelated upstream style under our newer pinned Clippy.
          & cargo +1.96.0 clippy --manifest-path $manifest --locked --target $validationTarget --package markdown-renderer-resvg-worker --all-targets --no-deps -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'The isolated resvg worker failed Clippy.' }
          $rebuildRoot = Join-Path $env:RUNNER_TEMP 'resvg-worker-rebuilds'
          $targetRoot = Join-Path $env:RUNNER_TEMP 'resvg-worker-target'
          New-Item -ItemType Directory -Path $rebuildRoot -Force | Out-Null
          $rebuiltWorkers = [ordered]@{}
          foreach ($worker in $workerTargets.GetEnumerator()) {
            $rebuilt = .\MarkdownRenderer\src\MarkdownRenderer.Svg.Resvg\eng\Build-ResvgWorker.ps1 `
              -Target $worker.Key `
              -TargetDirectory $targetRoot
            $rebuiltDirectory = Join-Path $rebuildRoot $worker.Value
            New-Item -ItemType Directory -Path $rebuiltDirectory -Force | Out-Null
            $rebuiltCopy = Join-Path $rebuiltDirectory 'MarkdownRenderer.Svg.Resvg.Worker.exe'
            Copy-Item -LiteralPath $rebuilt -Destination $rebuiltCopy -Force
            $rebuiltWorkers[$worker.Value] = $rebuiltCopy
          }

          $mismatches = [Collections.Generic.List[string]]::new()
          foreach ($worker in $workerTargets.GetEnumerator()) {
            $shipping = ".\MarkdownRenderer\src\MarkdownRenderer.Svg.Resvg\runtimes\$($worker.Value)\native\MarkdownRenderer.Svg.Resvg.Worker.exe"
            try {
              .\MarkdownRenderer\src\MarkdownRenderer.Svg.Resvg\eng\Compare-ResvgWorkerBinary.ps1 `
                -Expected $shipping `
                -Actual $rebuiltWorkers[$worker.Value]
            }
            catch {
              $mismatches.Add("$($worker.Value): $($_.Exception.Message)")
            }
          }
          if ($mismatches.Count -ne 0) {
            throw "One or more checked-in resvg workers were not reproduced:`n$($mismatches -join "`n")"
          }
          .\MarkdownRenderer\src\MarkdownRenderer.Svg.Resvg\eng\Test-ResvgLicenseSelection.ps1
          .\MarkdownRenderer\src\MarkdownRenderer.Svg.Resvg\eng\Verify-ResvgSupplyChain.ps1
          .\MarkdownRenderer\src\MarkdownRenderer.Svg.Resvg\eng\Test-ResvgWorkerIdentity.ps1
          .\MarkdownRenderer\src\MarkdownRenderer.Svg.Resvg\eng\Verify-ResvgWorkerIdentity.ps1 `
            -WorkerRoot '.\MarkdownRenderer\src\MarkdownRenderer.Svg.Resvg' -Rid 'win-x64'

      - name: Upload rebuilt resvg workers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resvg-worker-rebuilds
          path: ${{ runner.temp }}/resvg-worker-rebuilds/**
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare fresh artifact directories
        run: |
          $artifactRoot = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'markdownrenderer-preview'))
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
          if (-not $artifactRoot.StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Artifact root escaped RUNNER_TEMP: $artifactRoot"
          }
          if (Test-Path -LiteralPath $artifactRoot) {
            Remove-Item -LiteralPath $artifactRoot -Recurse -Force
          }
          foreach ($directory in @(
            'test-results'
            'native-aot'
            'benchmarks'
            'packages-reference'
            'packages-candidate'
            'package-rebuild-evidence'
            'managed-pack-evidence'
            'compliance')) {
            New-Item -ItemType Directory -Path (Join-Path $artifactRoot $directory) | Out-Null
          }

      - name: Rebuild and verify patched Mermaid native sources
        run: |
          $previousRustupToolchain = $env:RUSTUP_TOOLCHAIN
          $previousCargoTermColor = $env:CARGO_TERM_COLOR
          try {
            # The preceding Rust setup step installs 1.96.0 and all three MSVC
            # targets. Select that exact toolchain for the native build and
            # focused tests, regardless of the runner's default toolchain.
            $env:RUSTUP_TOOLCHAIN = '1.96.0'
            $env:CARGO_TERM_COLOR = 'never'

            & .\MarkdownRenderer\src\MarkdownRenderer.Mermaid\native\Build-Native.ps1 `
              -Platform @('x64', 'x86', 'ARM64')
            if ($LASTEXITCODE -ne 0) { throw 'The pinned Mermaid native build or adapter tests failed.' }

            $provenance = Get-Content '.\MarkdownRenderer\src\MarkdownRenderer.Mermaid\MERMAN_PROVENANCE.json' -Raw |
              ConvertFrom-Json -ErrorAction Stop
            $pinnedRevision = [string]$provenance.revision
            $cargoHome = if ([string]::IsNullOrWhiteSpace($env:CARGO_HOME)) {
              Join-Path $env:USERPROFILE '.cargo'
            } else {
              [IO.Path]::GetFullPath($env:CARGO_HOME)
            }
            $checkoutsRoot = Join-Path $cargoHome 'git\checkouts'
            if (-not (Test-Path -LiteralPath $checkoutsRoot -PathType Container)) {
              throw "Cargo did not create its Merman source checkout cache: $checkoutsRoot"
            }

            $git = (Get-Command git.exe -CommandType Application -ErrorAction Stop |
              Select-Object -First 1).Source
            $pinnedCheckouts = [Collections.Generic.List[string]]::new()
            foreach ($checkoutGroup in Get-ChildItem -LiteralPath $checkoutsRoot -Directory -Filter 'merman-*') {
              foreach ($candidate in Get-ChildItem -LiteralPath $checkoutGroup.FullName -Directory) {
                if (-not (Test-Path -LiteralPath (Join-Path $candidate.FullName '.git'))) { continue }
                $head = @(& $git -c core.autocrlf=false -C $candidate.FullName rev-parse HEAD 2>$null)
                $headExitCode = $LASTEXITCODE
                if ($headExitCode -eq 0 -and [string]$head[0] -ceq $pinnedRevision) {
                  $pinnedCheckouts.Add($candidate.FullName)
                }
              }
            }
            if ($pinnedCheckouts.Count -ne 1) {
              throw "Expected one Cargo Merman checkout at pinned revision $pinnedRevision; found $($pinnedCheckouts.Count)."
            }
            $pinnedRepositoryPath = $pinnedCheckouts[0]

            $preparationResult = & .\MarkdownRenderer\src\MarkdownRenderer.Mermaid\native\Test-Prepare-MermanSource.ps1 `
              -PinnedRepositoryPath $pinnedRepositoryPath
            if ($preparationResult.Result -ne 'PASS' -or
                $preparationResult.Checks -ne 49 -or
                $preparationResult.SharedCargoCheckoutWritten -ne $false -or
                $preparationResult.TemporaryTestRootRemoved -ne $true) {
              throw 'The isolated Merman source-preparation contract did not pass all 49 checks safely.'
            }

            $sourcePatchResult = & .\MarkdownRenderer\src\MarkdownRenderer.Mermaid\native\Test-MermanPatchedSource.ps1 `
              -PinnedRepositoryPath $pinnedRepositoryPath
            if ($sourcePatchResult.Result -ne 'PASS' -or
                $sourcePatchResult.TestCount -ne 117 -or
                $sourcePatchResult.CargoTargetOutsidePreparedSource -ne $true -or
                $sourcePatchResult.TemporaryTestRootRemoved -ne $true -or
                $sourcePatchResult.SharedCargoCheckoutWritten -ne $false) {
              throw 'The focused patched-Merman regression suite did not pass all 117 isolated tests.'
            }
          }
          finally {
            $env:RUSTUP_TOOLCHAIN = $previousRustupToolchain
            $env:CARGO_TERM_COLOR = $previousCargoTermColor
          }

      - name: Restore test projects in locked mode
        run: |
          $projects = @(
            '.\MarkdownRenderer\tests\MarkdownRenderer.Tests\MarkdownRenderer.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.GitHub.Tests\MarkdownRenderer.GitHub.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.Html.Tests\MarkdownRenderer.Html.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.Math.Tests\MarkdownRenderer.Math.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.Mermaid.Tests\MarkdownRenderer.Mermaid.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.Svg.Resvg.Tests\MarkdownRenderer.Svg.Resvg.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.SyntaxHighlighting.TextMate.Tests\MarkdownRenderer.SyntaxHighlighting.TextMate.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.Conformance.Tests\MarkdownRenderer.Conformance.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.PixelTests\MarkdownRenderer.PixelTests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.PublicApi.Tests\MarkdownRenderer.PublicApi.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.Sample.Automation.Tests\MarkdownRenderer.Sample.Automation.Tests.csproj'
          )
          foreach ($project in $projects) {
            & dotnet restore $project `
              -p:Configuration=$env:CONFIGURATION `
              -p:Platform=$env:PLATFORM `
              --locked-mode `
              --disable-build-servers
            if ($LASTEXITCODE -ne 0) { throw "Locked restore failed for '$project'." }
          }

      - name: Build test projects without restore
        run: |
          $projects = @(
            '.\MarkdownRenderer\tests\MarkdownRenderer.Tests\MarkdownRenderer.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.GitHub.Tests\MarkdownRenderer.GitHub.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.Html.Tests\MarkdownRenderer.Html.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.Math.Tests\MarkdownRenderer.Math.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.Mermaid.Tests\MarkdownRenderer.Mermaid.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.Svg.Resvg.Tests\MarkdownRenderer.Svg.Resvg.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.SyntaxHighlighting.TextMate.Tests\MarkdownRenderer.SyntaxHighlighting.TextMate.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.Conformance.Tests\MarkdownRenderer.Conformance.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.PixelTests\MarkdownRenderer.PixelTests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.PublicApi.Tests\MarkdownRenderer.PublicApi.Tests.csproj'
            '.\MarkdownRenderer\tests\MarkdownRenderer.Sample.Automation.Tests\MarkdownRenderer.Sample.Automation.Tests.csproj'
          )
          foreach ($project in $projects) {
            & dotnet build $project `
              --configuration $env:CONFIGURATION `
              -p:Platform=$env:PLATFORM `
              -p:UseSharedCompilation=false `
              --no-restore `
              --disable-build-servers
            if ($LASTEXITCODE -ne 0) { throw "Build failed for '$project'." }
          }

      - name: Prime the external performance-gate script
        run: |
          # The first child PowerShell parse on a fresh hosted runner may be
          # delayed by script scanning. Prime that exact immutable script
          # before the fixture's bounded child-process checks begin.
          $script = Resolve-Path '.\MarkdownRenderer\eng\Test-MarkdownWinUIPerformanceGates.ps1'
          $missingReport = Join-Path $env:RUNNER_TEMP 'expected-missing-performance-report.json'
          $process = Start-Process `
            -FilePath 'pwsh' `
            -ArgumentList @(
              '-NoLogo',
              '-NoProfile',
              '-NonInteractive',
              '-File',
              $script.Path,
              '-ReportPath',
              $missingReport) `
            -PassThru `
            -Wait `
            -WindowStyle Hidden
          if ($process.ExitCode -eq 0) {
            throw 'The performance-gate priming invocation unexpectedly accepted a missing report.'
          }

      - name: Run Core, GitHub, HTML, Math, Mermaid, SVG, TextMate, conformance, public API, and sample-automation tests
        run: |
          $tests = [ordered]@{
            core = '.\MarkdownRenderer\tests\MarkdownRenderer.Tests\MarkdownRenderer.Tests.csproj'
            github = '.\MarkdownRenderer\tests\MarkdownRenderer.GitHub.Tests\MarkdownRenderer.GitHub.Tests.csproj'
            html = '.\MarkdownRenderer\tests\MarkdownRenderer.Html.Tests\MarkdownRenderer.Html.Tests.csproj'
            math = '.\MarkdownRenderer\tests\MarkdownRenderer.Math.Tests\MarkdownRenderer.Math.Tests.csproj'
            mermaid = '.\MarkdownRenderer\tests\MarkdownRenderer.Mermaid.Tests\MarkdownRenderer.Mermaid.Tests.csproj'
            svg = '.\MarkdownRenderer\tests\MarkdownRenderer.Svg.Resvg.Tests\MarkdownRenderer.Svg.Resvg.Tests.csproj'
            textmate = '.\MarkdownRenderer\tests\MarkdownRenderer.SyntaxHighlighting.TextMate.Tests\MarkdownRenderer.SyntaxHighlighting.TextMate.Tests.csproj'
            conformance = '.\MarkdownRenderer\tests\MarkdownRenderer.Conformance.Tests\MarkdownRenderer.Conformance.Tests.csproj'
            publicapi = '.\MarkdownRenderer\tests\MarkdownRenderer.PublicApi.Tests\MarkdownRenderer.PublicApi.Tests.csproj'
            sampleautomation = '.\MarkdownRenderer\tests\MarkdownRenderer.Sample.Automation.Tests\MarkdownRenderer.Sample.Automation.Tests.csproj'
          }
          $results = Join-Path $env:RUNNER_TEMP 'markdownrenderer-preview\test-results'
          # Wall-clock-bounded security/cancellation tests run alone in their
          # own testhost, keyed by the suite whose project owns them.
          $deadlineSensitiveTests = [ordered]@{
            hostedCancellation = @{ Suite = 'core'; Name = 'MarkdownRenderer.Tests.HostedElementLifecycleContractTests.ThrowingCancellationCallbackCannotEscapeCleanup' }
            authoredSvgDoctype = @{ Suite = 'svg'; Name = 'MarkdownRenderer.Svg.Resvg.Tests.SvgResourceBudgetTests.Validate_RejectsExternalDoctypeInTheAuthoredRootDocument' }
          }
          $exclusionTerms = @{}
          foreach ($suite in @('core', 'svg')) {
            $exclusionTerms[$suite] = [Collections.Generic.List[string]]::new()
          }
          $exclusionTerms['core'].Add('FullyQualifiedName!~PerformanceExternalGateFixtureTests')
          foreach ($test in $deadlineSensitiveTests.GetEnumerator()) {
            $exclusionTerms[$test.Value.Suite].Add("FullyQualifiedName!~$($test.Value.Name)")
          }

          # WebP decoding goes through the Store-only Windows WebP Image
          # Extension, which hosted Windows Server runners do not have. Tests
          # that need it carry Requires=WicWebpDecoder; without the codec they
          # are listed in a warning as not run, never counted as passed.
          $webpDecoderAvailable = $null -ne (Get-AppxPackage -Name 'Microsoft.WebpImageExtension' -ErrorAction SilentlyContinue)
          $githubTestFilter = $null
          if (-not $webpDecoderAvailable) {
            $githubTestFilter = 'Requires!=WicWebpDecoder'
            $notRun = @(& dotnet test $tests.github --configuration $env:CONFIGURATION "-p:Platform=$env:PLATFORM" --no-build --disable-build-servers --list-tests --filter 'Requires=WicWebpDecoder' |
              Where-Object { $_ -match '^\s{4}\S' } | ForEach-Object { $_.Trim() })
            Write-Host "::warning title=WebP codec tests not run::The runner has no Windows WebP Image Extension, so $($notRun.Count) WicWebpDecoder tests did not run: $($notRun -join ', ')"
          }

          foreach ($test in $tests.GetEnumerator()) {
            $arguments = @(
              'test', $test.Value,
              '--configuration', $env:CONFIGURATION,
              "-p:Platform=$env:PLATFORM",
              '--no-build',
              '--disable-build-servers',
              '--results-directory', $results,
              '--logger', "trx;LogFileName=$($test.Key).trx")
            if ($exclusionTerms.ContainsKey($test.Key)) {
              # The core external-gate fixture launches many bounded child
              # processes. Run it in its own testhost so scheduling pressure
              # cannot turn wall-clock-bounded security/cancellation tests into
              # false failures. Such tests are isolated below to avoid unrelated
              # xUnit load.
              $arguments += @('--filter', ($exclusionTerms[$test.Key] -join '&'))
            }
            if ($test.Key -eq 'github' -and $githubTestFilter) {
              $arguments += @('--filter', $githubTestFilter)
            }
            & dotnet @arguments
            if ($LASTEXITCODE -ne 0) { throw "$($test.Key) tests failed." }
          }

          foreach ($suite in $exclusionTerms.Keys) {
            $suiteResultsPath = Join-Path $results "$suite.trx"
            [xml]$suiteTrx = Get-Content -LiteralPath $suiteResultsPath -Raw
            $suiteResultNames = @($suiteTrx.TestRun.Results.UnitTestResult | ForEach-Object { [string]$_.testName })
            if ($suiteResultNames.Count -lt 1) {
              throw "The broad $suite test filter matched no tests."
            }
            foreach ($test in $deadlineSensitiveTests.GetEnumerator()) {
              if ($test.Value.Suite -eq $suite -and $suiteResultNames -contains $test.Value.Name) {
                throw "Deadline-sensitive test '$($test.Value.Name)' was not excluded from the parallel $suite testhost."
              }
            }
          }

          foreach ($test in $deadlineSensitiveTests.GetEnumerator()) {
            $suite = $test.Value.Suite
            & dotnet test $tests[$suite] `
              --configuration $env:CONFIGURATION `
              -p:Platform=$env:PLATFORM `
              --no-build `
              --disable-build-servers `
              --results-directory $results `
              --logger "trx;LogFileName=$suite-$($test.Key).trx" `
              --filter "FullyQualifiedName~$($test.Value.Name)"
            if ($LASTEXITCODE -ne 0) { throw "Isolated $suite test '$($test.Key)' failed." }

            $isolatedResultPath = Join-Path $results "$suite-$($test.Key).trx"
            [xml]$isolatedTrx = Get-Content -LiteralPath $isolatedResultPath -Raw
            $isolatedResultNames = @($isolatedTrx.TestRun.Results.UnitTestResult | ForEach-Object { [string]$_.testName })
            if ($isolatedResultNames.Count -ne 1 -or $isolatedResultNames[0] -ne $test.Value.Name) {
              throw "Isolated filter for '$($test.Value.Name)' did not execute exactly that $suite test."
            }
          }

          & dotnet test $tests.core `
              --configuration $env:CONFIGURATION `
              -p:Platform=$env:PLATFORM `
              --no-build `
              --disable-build-servers `
              --results-directory $results `
              --logger 'trx;LogFileName=core-external-gate.trx' `
              --filter 'FullyQualifiedName~PerformanceExternalGateFixtureTests'
          if ($LASTEXITCODE -ne 0) { throw 'Core external-gate fixture tests failed.' }

          $externalGateResultsPath = Join-Path $results 'core-external-gate.trx'
          [xml]$externalGateTrx = Get-Content -LiteralPath $externalGateResultsPath -Raw
          $externalGateResultNames = @($externalGateTrx.TestRun.Results.UnitTestResult | ForEach-Object { [string]$_.testName })
          if ($externalGateResultNames.Count -lt 1) {
            throw 'The Core external-gate filter matched no tests.'
          }

      - name: Build and test the JitHub WinUI consumer
        run: |
          $app = '.\JitHub.WinUI\JitHub.WinUI.csproj'
          $tests = '.\JitHub.WinUI.Tests\JitHub.WinUI.Tests.csproj'
          foreach ($project in @($tests, $app)) {
            & dotnet restore $project `
              -p:Configuration=$env:CONFIGURATION `
              -p:Platform=$env:PLATFORM `
              --locked-mode `
              --disable-build-servers
            if ($LASTEXITCODE -ne 0) { throw "Locked JitHub restore failed for '$project'." }
          }

          & dotnet build $tests `
            --configuration $env:CONFIGURATION `
            -p:Platform=$env:PLATFORM `
            -p:UseSharedCompilation=false `
            --no-restore `
            --disable-build-servers
          if ($LASTEXITCODE -ne 0) { throw 'JitHub consumer tests failed to build.' }

          & dotnet build $app `
            --configuration $env:CONFIGURATION `
            -p:Platform=$env:PLATFORM `
            -p:UseSharedCompilation=false `
            -p:SkipReleaseSecurityGate=true `
            -p:GenerateAppxPackageOnBuild=false `
            --no-restore `
            --disable-build-servers
          if ($LASTEXITCODE -ne 0) { throw 'JitHub WinUI failed to consume the preview renderer.' }

          $results = Join-Path $env:RUNNER_TEMP 'markdownrenderer-preview\test-results'
          & dotnet test $tests `
            --configuration $env:CONFIGURATION `
            -p:Platform=$env:PLATFORM `
            --no-build `
            --no-restore `
            --disable-build-servers `
            --results-directory $results `
            --logger 'trx;LogFileName=jithub-consumer.trx'
          if ($LASTEXITCODE -ne 0) { throw 'JitHub consumer tests failed.' }

      - name: Run executable benchmark and allocation gates
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'markdownrenderer-preview'
          $benchmarkRoot = Join-Path $artifactRoot 'benchmarks'
          $candidateArtifacts = Join-Path $benchmarkRoot 'candidate'
          New-Item -ItemType Directory -Path $candidateArtifacts | Out-Null

          $candidateProject = '.\MarkdownRenderer\perf\MarkdownRenderer.Benchmarks\MarkdownRenderer.Benchmarks.csproj'
          & dotnet restore $candidateProject `
            -p:Configuration=$env:CONFIGURATION `
            -p:Platform=$env:PLATFORM `
            --locked-mode `
            --disable-build-servers
          if ($LASTEXITCODE -ne 0) { throw 'Locked benchmark restore failed.' }

          & dotnet build $candidateProject `
            --configuration $env:CONFIGURATION `
            -p:Platform=$env:PLATFORM `
            -p:UseSharedCompilation=false `
            --no-restore `
            --disable-build-servers
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark project failed to build.' }

          $referenceArtifacts = $null
          $baseSha = $env:BENCHMARK_BASE_SHA
          $hasUsableBase = -not [string]::IsNullOrWhiteSpace($baseSha) -and
            $baseSha -match '^[0-9a-fA-F]{40}$' -and
            $baseSha -notmatch '^0{40}$'
          if ($hasUsableBase) {
            & git cat-file -e "$($baseSha)^{commit}" 2>$null
            $hasUsableBase = $LASTEXITCODE -eq 0
          }
          if ($hasUsableBase) {
            & git cat-file -e "$($baseSha):MarkdownRenderer/perf/MarkdownRenderer.Benchmarks/MarkdownRenderer.Benchmarks.csproj" 2>$null
            $hasUsableBase = $LASTEXITCODE -eq 0
          }

          if ($hasUsableBase) {
            $baseSource = Join-Path $artifactRoot 'benchmark-reference-source'
            $resolvedBaseSource = [IO.Path]::GetFullPath($baseSource)
            $resolvedArtifactRoot = [IO.Path]::GetFullPath($artifactRoot).TrimEnd(
              [IO.Path]::DirectorySeparatorChar,
              [IO.Path]::AltDirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
            if (-not $resolvedBaseSource.StartsWith($resolvedArtifactRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Benchmark worktree escaped the artifact root: $resolvedBaseSource"
            }

            & git worktree add --detach $resolvedBaseSource $baseSha
            if ($LASTEXITCODE -ne 0) { throw "Could not create benchmark reference worktree for '$baseSha'." }

            $referenceProject = Join-Path $resolvedBaseSource 'MarkdownRenderer\perf\MarkdownRenderer.Benchmarks\MarkdownRenderer.Benchmarks.csproj'
            & dotnet restore $referenceProject `
              -p:Configuration=$env:CONFIGURATION `
              -p:Platform=$env:PLATFORM `
              --locked-mode `
              --disable-build-servers
            if ($LASTEXITCODE -ne 0) { throw "Locked reference benchmark restore failed for '$baseSha'." }

            & dotnet build $referenceProject `
              --configuration $env:CONFIGURATION `
              -p:Platform=$env:PLATFORM `
              -p:UseSharedCompilation=false `
              --no-restore `
              --disable-build-servers
            if ($LASTEXITCODE -ne 0) { throw "Reference benchmark build failed for '$baseSha'." }

            $referenceArtifacts = Join-Path $benchmarkRoot 'reference'
            New-Item -ItemType Directory -Path $referenceArtifacts | Out-Null
            & dotnet run --project $referenceProject `
              --configuration $env:CONFIGURATION `
              -p:Platform=$env:PLATFORM `
              --no-build `
              --no-restore `
              -- `
              --job Short `
              --iterationCount 10 `
              --exporters JSON `
              --artifacts $referenceArtifacts `
              --filter '*'
            if ($LASTEXITCODE -ne 0) { throw "Reference benchmarks failed for '$baseSha'." }
          }
          else {
            Write-Host '::notice::No compatible base benchmark project is available; running absolute and allocation gates only.'
          }

          & dotnet run --project $candidateProject `
            --configuration $env:CONFIGURATION `
            -p:Platform=$env:PLATFORM `
            --no-build `
            --no-restore `
            -- `
            --job Short `
            --iterationCount 10 `
            --exporters JSON `
            --artifacts $candidateArtifacts `
            --filter '*'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate benchmarks failed.' }

          $gateArguments = @{ CandidateDirectory = $candidateArtifacts }
          if ($null -ne $referenceArtifacts) {
            $gateArguments.ReferenceDirectory = $referenceArtifacts
          }
          & '.\MarkdownRenderer\eng\Test-MarkdownBenchmarkGates.ps1' @gateArguments

      - name: Restore NativeAOT smoke projects without mutating canonical locks
