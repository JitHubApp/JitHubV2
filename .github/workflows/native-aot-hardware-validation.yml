name: Native AOT hardware validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.architecture }} on matching hardware
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86
            platform: x86
            rid: win-x86
            runner: X86
          - architecture: x64
            platform: x64
            rid: win-x64
            runner: X64
          - architecture: arm64
            platform: ARM64
            rid: win-arm64
            runner: ARM64
    runs-on:
      - self-hosted
      - Windows
      - ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - uses: microsoft/setup-WinAppCli@v0.2

      - name: Restore and publish Native AOT
        shell: pwsh
        run: |
          .\eng\Restore-NativeAot.ps1 -Architecture ${{ matrix.architecture }}
          .\eng\Update-NativeAotDependencyLedger.ps1 -Verify
          dotnet publish .\JitHub.WinUI\JitHub.WinUI.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            -p:Platform=${{ matrix.platform }} `
            -p:GenerateAppxPackageOnBuild=false `
            -p:SkipReleaseSecurityGate=true `
            --no-restore `
            -o .\artifacts\hardware\${{ matrix.architecture }}\publish `
            -v:minimal
          .\eng\Verify-NativeAotArtifact.ps1 `
            -InputPath .\artifacts\hardware\${{ matrix.architecture }}\publish `
            -Architecture ${{ matrix.architecture }}

      - name: Exercise packaged Native AOT UI matrix
        shell: pwsh
        run: |
          $publishDirectory = [System.IO.Path]::GetFullPath(".\artifacts\hardware\${{ matrix.architecture }}\publish")
          $manifest = Get-ChildItem ".\JitHub.WinUI\bin\${{ matrix.platform }}\Release" -Recurse -Filter AppxManifest.xml |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $manifest) { throw 'Generated AppxManifest.xml was not found.' }

          .\eng\Invoke-NativeAotUiMatrix.ps1 `
            -InputPath $publishDirectory `
            -ManifestPath $manifest.FullName `
            -OutputDirectory ".\artifacts\hardware\${{ matrix.architecture }}\evidence" `
            -AutomationDataRoot ".\artifacts\hardware\${{ matrix.architecture }}\data-dark" `
            -Architecture ${{ matrix.architecture }} `
            -Theme dark `
            -ViewportWidth 1366 `
            -ViewportHeight 900 `
            -Scenario vnext-native-aot

          .\eng\Invoke-NativeAotUiMatrix.ps1 `
            -InputPath $publishDirectory `
            -ManifestPath $manifest.FullName `
            -OutputDirectory ".\artifacts\hardware\${{ matrix.architecture }}\evidence-compact-light" `
            -AutomationDataRoot ".\artifacts\hardware\${{ matrix.architecture }}\data-compact-light" `
            -Architecture ${{ matrix.architecture }} `
            -Theme light `
            -ViewportWidth 760 `
            -ViewportHeight 650 `
            -Scenario vnext-native-aot `
            -Routes home,settings,repo-code,repo-issues,repo-pull-requests

          .\eng\Invoke-NativeAotUiMatrix.ps1 `
            -InputPath $publishDirectory `
            -ManifestPath $manifest.FullName `
            -OutputDirectory ".\artifacts\hardware\${{ matrix.architecture }}\evidence-high-contrast" `
            -AutomationDataRoot ".\artifacts\hardware\${{ matrix.architecture }}\data-high-contrast" `
            -Architecture ${{ matrix.architecture }} `
            -Theme dark `
            -HighContrast `
            -ViewportWidth 1366 `
            -ViewportHeight 900 `
            -Scenario vnext-native-aot `
            -Routes home,settings,profile,repo-code,repo-issues,repo-pull-requests

      - name: Upload hardware evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-hardware-${{ matrix.architecture }}
          path: artifacts/hardware/${{ matrix.architecture }}/evidence*
          if-no-files-found: error
          retention-days: 30
