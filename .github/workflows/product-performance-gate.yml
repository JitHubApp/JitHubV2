name: Product performance gate

on:
  # Feature-branch pushes are already covered by pull_request below. Limiting
  # push runs to main avoids running the contract gate twice for the same PR
  # head SHA while retaining post-merge/default-branch coverage.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# CI checks the budgets and the benchmark plan only. The live benchmark
# launches the app on an interactive desktop, which hosted runners do not
# provide, so it runs locally before a release (see section 6 of
# docs/jithub-vnext-audit-remediation-handoff.md).
jobs:
  contract-gate:
    name: Validate performance budgets and executable plan
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Restore performance projects
        shell: pwsh
        run: |
          dotnet restore .\JitHub.Core.Tests\JitHub.Core.Tests.csproj -p:Platform=x64
          dotnet restore .\JitHub.WinUI.Tests\JitHub.WinUI.Tests.csproj -p:Platform=x64
          dotnet restore .\JitHub.WinUI.PerformanceGate\JitHub.WinUI.PerformanceGate.csproj -p:Platform=x64
          dotnet restore .\JitHub.WinUI.Automation\JitHub.WinUI.Automation.csproj

      - name: Run performance contract tests
        shell: pwsh
        run: |
          dotnet test .\JitHub.Core.Tests\JitHub.Core.Tests.csproj `
            -c Release -p:Platform=x64 --no-restore `
            --filter "FullyQualifiedName~ProductPerformance" `
            --logger "trx;LogFileName=product-performance-core-contracts.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test .\JitHub.WinUI.Tests\JitHub.WinUI.Tests.csproj `
            -c Release -p:Platform=x64 --no-restore `
            --filter "FullyQualifiedName~ProductPerformance" `
            --logger "trx;LogFileName=product-performance-contracts.trx"

      - name: Build performance gate
        shell: pwsh
        run: |
          dotnet build .\JitHub.WinUI.PerformanceGate\JitHub.WinUI.PerformanceGate.csproj -c Release -p:Platform=x64 --no-restore
          dotnet build .\JitHub.WinUI.Automation\JitHub.WinUI.Automation.csproj -c Release --no-restore

      - name: Materialize canonical benchmark plan
        shell: pwsh
        run: >
          .\eng\Invoke-ProductPerformanceGate.ps1
          -PlanOnly -Configuration Release -Iterations 10
          -OutputPath .\artifacts\performance\product-performance-plan.json
          -SkipBuild

      - name: Upload performance contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-performance-contracts
          path: |
            **/product-performance-contracts.trx
            artifacts/performance/product-performance-plan.json
